version: "3"


tasks:
  run:local:
    aliases:
      - loc
    cmd: go run cmd/main.go --config=./config/local.yaml

  run:dev:
    aliases:
      - dev
    cmd: go run cmd/main.go --config=./config/dev.yaml

  run:enviroment:
    aliases:
      - env
    cmd: go run cmd/main.go

  docker-image:
    aliases:
      - doc-img
    cmd: docker build -t arumandesu/api-gateway -t arumandesu/api-gateway:0.1.3 . && docker push arumandesu/api-gateway -a